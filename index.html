<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHAIN REACTOR — 連鎖実験室</title><link rel="stylesheet" href="./app.css"><link rel="stylesheet" href="./studio.css"></head><body>
<header><h1>CHAIN<span>REACTOR</span></h1><button id="reset">再実験</button><button id="power" aria-pressed="false">通電 E</button><button id="pause">停止</button><output id="stats" aria-live="off" aria-label="実験状況" tabindex="0"></output></header>
<main class="workspace"><aside id="tools" aria-label="制作道具"><h2>組み替える</h2></aside><section class="arena" aria-label="実験場"><p id="mission"></p><canvas id="view" width="1400" height="800" tabindex="0" aria-label="矢印で狙い、Spaceで発射。Enterで選択ツールを実行。ホイールで拡大。"></canvas><div class="arena-hint">狙って発射 <kbd>SPACE</kbd>　通電 <kbd>E</kbd>　やり直す <kbd>R</kbd></div><nav id="transport" aria-label="時間と視点"></nav></section><aside id="inspector" aria-label="連鎖の記録"><h2>何が起きた？</h2><p class="empty-log">通電か射撃で、反応を始めよう。</p></aside></main>
<footer id="files" aria-label="設計図と音響"></footer><script type="module" src="./dist/app.js"></script></body></html>
